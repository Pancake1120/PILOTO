<script>
const no=document.getElementById("no");
const yes=document.getElementById("yes");
const arena=document.getElementById("arena");
const question=document.getElementById("question");
const success=document.getElementById("success");

function dodge(){
  const pad=4;
  const maxX=Math.max(pad,arena.clientWidth-no.offsetWidth-pad);
  const maxY=Math.max(pad,arena.clientHeight-no.offsetHeight-pad);
  no.style.left=Math.floor(Math.random()*maxX)+"px";
  no.style.top=Math.floor(Math.random()*maxY)+"px";
  no.style.transform="none";
}
no.addEventListener("mouseenter",dodge);
no.addEventListener("pointerdown",e=>{e.preventDefault();dodge()});
no.addEventListener("touchstart",e=>{e.preventDefault();dodge()},{passive:false});

yes.addEventListener("click",()=>{
  question.style.display="none";
  success.style.display="block";
});
</script>
