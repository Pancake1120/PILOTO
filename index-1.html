<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The House Between Stars — prévia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=EB+Garamond:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --wood-dark:#150e09;
    --wood:#2b1c12;
    --wood-mid:#4a3222;
    --wood-light:#7a5738;
    --wall-blue-dark:#0e1622;
    --wall-blue:#1c2b3d;
    --wall-blue-light:#324a63;
    --warm:#f0b968;
    --warm-soft:#c98a45;
    --warm-dim:#8a5a2c;
    --night:#05070d;
    --night-mid:#111a2e;
    --night-light:#22314e;
    --star:#e7ecff;
    --lab-dark:#0d1e1c;
    --lab:#1d3a35;
    --lab-glow:#79ddc4;
    --ink:#08070a;
    --paper:#e8dcc4;
    font-size:16px;
  }

  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;
    width:100%;height:100%;
    overflow:hidden;
    background:var(--ink);
    font-family:'EB Garamond', serif;
    color:var(--paper);
    -webkit-user-select:none;user-select:none;
    touch-action:none;
  }

  /* ---------- HUD ---------- */
  .hud{
    position:fixed;top:0;left:0;right:0;
    display:flex;justify-content:space-between;align-items:flex-start;
    padding:1.6rem 2rem;
    z-index:50;pointer-events:none;
    font-family:'Cormorant Garamond', serif;
    letter-spacing:0.08em;
  }
  .hud-time{
    font-size:1.1rem;
    color:rgba(232,220,196,0.55);
    font-weight:500;
  }
  .hud-room{
    font-size:1rem;
    color:rgba(232,220,196,0.5);
    text-align:right;
    font-style:italic;
  }
  .hud-room .divider{opacity:0.4; margin:0 0.4em; font-style:normal;}

  .hud-footer{
    position:fixed;bottom:0;left:0;right:0;
    display:flex;justify-content:space-between;
    padding:1.6rem 2.2rem;
    z-index:50;pointer-events:none;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:0.95rem;
    color:rgba(232,220,196,0.35);
    letter-spacing:0.04em;
    transition:opacity 0.6s ease;
  }
  .hud-footer.hide{opacity:0;}

  .dots{
    position:fixed;bottom:1.7rem;left:50%;transform:translateX(-50%);
    display:flex;gap:8px;z-index:50;pointer-events:none;
  }
  .dot{
    width:5px;height:5px;border-radius:50%;
    background:rgba(232,220,196,0.25);
    transition:background 0.4s ease, transform 0.4s ease;
  }
  .dot.active{background:rgba(240,185,104,0.85); transform:scale(1.4);}

  .sound-toggle{
    position:fixed;top:1.7rem;left:50%;transform:translateX(-50%);
    z-index:60;pointer-events:auto;cursor:pointer;
    background:none;border:1px solid rgba(232,220,196,0.25);
    color:rgba(232,220,196,0.55);
    font-family:'Cormorant Garamond', serif;
    font-size:0.78rem;letter-spacing:0.15em;
    padding:0.35em 0.9em;border-radius:2px;
    transition:all 0.3s ease;
  }
  .sound-toggle:hover{border-color:rgba(240,185,104,0.6); color:var(--warm);}
  .sound-toggle.on{border-color:rgba(240,185,104,0.7); color:var(--warm);}

  /* edge nav hints */
  .edge-nav{
    position:fixed;top:0;bottom:0;width:8%;z-index:40;
    display:flex;align-items:center;
    cursor:pointer;
    opacity:0;transition:opacity 0.4s ease;
  }
  .edge-nav.visible{opacity:1;}
  .edge-nav.left{left:0;justify-content:flex-start;padding-left:0.8rem;}
  .edge-nav.right{right:0;justify-content:flex-end;padding-right:0.8rem;}
  .edge-nav span{
    font-size:2rem;color:rgba(232,220,196,0.3);
    font-family:'Cormorant Garamond', serif;
    transition:color 0.3s ease, transform 0.3s ease;
  }
  .edge-nav:hover span{color:rgba(240,185,104,0.7); }
  .edge-nav.left:hover span{transform:translateX(-4px);}
  .edge-nav.right:hover span{transform:translateX(4px);}

  /* ---------- Far background (stars beyond the house) ---------- */
  #farsky{
    position:fixed;top:0;left:0;height:100%;
    width:400vw;
    background:
      radial-gradient(1px 1px at 10% 20%, var(--star), transparent),
      radial-gradient(1px 1px at 30% 55%, var(--star), transparent),
      radial-gradient(1.5px 1.5px at 50% 15%, var(--star), transparent),
      radial-gradient(1px 1px at 70% 40%, var(--star), transparent),
      radial-gradient(1px 1px at 85% 65%, var(--star), transparent),
      radial-gradient(1.5px 1.5px at 95% 25%, var(--star), transparent),
      radial-gradient(1px 1px at 15% 80%, var(--star), transparent),
      radial-gradient(1px 1px at 45% 85%, var(--star), transparent),
      radial-gradient(1px 1px at 60% 10%, var(--star), transparent),
      radial-gradient(1px 1px at 25% 40%, var(--star), transparent),
      radial-gradient(1px 1px at 80% 90%, var(--star), transparent),
      linear-gradient(180deg, var(--night) 0%, var(--night-mid) 55%, var(--night-light) 100%);
    background-size:auto, auto, auto, auto, auto, auto, auto, auto, auto, auto, auto, cover;
    z-index:0;
    opacity:0.75;
    will-change:transform;
  }

  /* ---------- Stage / Track ---------- */
  #stage{
    position:fixed;inset:0;
    overflow:hidden;
    z-index:1;
  }
  #track{
    position:absolute;top:0;left:0;
    height:100%;
    display:flex;
    will-change:transform;
  }
  .room{
    position:relative;
    width:100vw;height:100%;
    flex:0 0 100vw;
    overflow:hidden;
  }
  .layer{
    position:absolute;inset:0;
  }

  /* floor shadow common to all rooms */
  .floor{
    position:absolute;bottom:0;left:0;right:0;height:22%;
    background:linear-gradient(180deg, transparent, rgba(0,0,0,0.55));
    z-index:5;
  }
  .vignette-room{
    position:absolute;inset:0;
    background:radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.55) 100%);
    z-index:6;pointer-events:none;
  }

  /* generic soft glow (lamp / window light) */
  .glow{
    position:absolute;border-radius:50%;
    filter:blur(30px);
    mix-blend-mode:screen;
    animation:flicker 6s ease-in-out infinite;
  }
  @keyframes flicker{
    0%,100%{opacity:0.85;}
    45%{opacity:1;}
    50%{opacity:0.7;}
    78%{opacity:0.95;}
  }

  .dust{
    position:absolute;border-radius:50%;
    background:rgba(240,220,180,0.5);
    filter:blur(0.5px);
    animation:drift linear infinite;
  }
  @keyframes drift{
    from{transform:translate(0,0);}
    to{transform:translate(var(--dx,20px), var(--dy,-140px));}
  }

  /* ================= EXTERIOR ================= */
  .room.exterior .sky{
    position:absolute;inset:0;
    background:linear-gradient(180deg, var(--night) 0%, var(--night-mid) 60%, var(--night-light) 100%);
  }
  .moon{
    position:absolute;top:12%;right:18%;
    width:70px;height:70px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #fdf6e3, #d8cfa8 70%);
    box-shadow:0 0 60px 18px rgba(253,246,227,0.25);
  }
  .house-silhouette{
    position:absolute;bottom:0;left:50%;transform:translateX(-50%);
    width:60%;height:55%;
    background:var(--wood-dark);
    clip-path:polygon(0% 100%, 0% 40%, 50% 8%, 100% 40%, 100% 100%);
  }
  .house-window{
    position:absolute;bottom:30%;left:50%;transform:translateX(-50%);
    width:60px;height:80px;
    background:linear-gradient(180deg, var(--warm), var(--warm-soft));
    box-shadow:0 0 40px 12px rgba(240,185,104,0.5);
    border-radius:2px;
  }
  .house-door{
    position:absolute;bottom:0;left:50%;transform:translateX(-50%);
    width:70px;height:42%;
    background:var(--wood);
    border-radius:35px 35px 0 0;
    border:2px solid var(--wood-mid);
  }
  .path{
    position:absolute;bottom:0;left:50%;transform:translateX(-50%);
    width:20%;height:12%;
    background:linear-gradient(180deg, rgba(90,70,50,0.5), transparent);
    clip-path:polygon(35% 0, 65% 0, 100% 100%, 0% 100%);
  }
  .rain{
    position:absolute;top:-10%;width:1px;height:14%;
    background:linear-gradient(180deg, transparent, rgba(200,220,255,0.35));
    animation:fall linear infinite;
  }
  @keyframes fall{
    from{transform:translateY(0);}
    to{transform:translateY(115vh);}
  }
  .tree{
    position:absolute;bottom:0;
    width:14px;height:38%;
    background:var(--wood-dark);
    clip-path:polygon(45% 0,55% 0,70% 100%,30% 100%);
  }
  .tree::before{
    content:'';position:absolute;bottom:60%;left:50%;transform:translateX(-50%);
    width:90px;height:90px;border-radius:50%;
    background:var(--wood-dark);
  }

  /* ================= SALA ================= */
  .room.sala .wall{
    position:absolute;inset:0;
    background:linear-gradient(180deg, var(--wall-blue-dark), var(--wall-blue) 60%, var(--wood) 100%);
  }
  .room.sala .wall::after{
    content:'';position:absolute;bottom:36%;left:0;right:0;height:2px;
    background:rgba(0,0,0,0.3);
  }
  .rug{
    position:absolute;bottom:6%;left:50%;transform:translateX(-50%);
    width:34%;height:8%;border-radius:50%;
    background:radial-gradient(ellipse, var(--warm-dim), transparent 75%);
    opacity:0.5;
  }
  .sofa{
    position:absolute;bottom:14%;left:20%;
    width:220px;height:90px;
    background:linear-gradient(180deg, var(--wood-light), var(--wood-mid));
    border-radius:16px 16px 4px 4px;
    box-shadow:inset 0 -10px 20px rgba(0,0,0,0.3);
  }
  .sofa::before, .sofa::after{
    content:'';position:absolute;top:-26px;width:60px;height:50px;
    background:inherit;border-radius:16px 16px 0 0;
  }
  .sofa::before{left:6px;}
  .sofa::after{right:6px;}
  .clock{
    position:absolute;top:18%;left:50%;
    width:64px;height:64px;border-radius:50%;
    background:radial-gradient(circle, #e9dcb8, #b99e6c 85%);
    border:4px solid var(--wood-mid);
    box-shadow:0 6px 18px rgba(0,0,0,0.5);
  }
  .clock::before, .clock::after{
    content:'';position:absolute;left:50%;bottom:50%;
    background:var(--ink);transform-origin:bottom center;
  }
  .clock::before{width:2px;height:16px;transform:translateX(-50%) rotate(160deg);}
  .clock::after{width:2px;height:22px;transform:translateX(-50%) rotate(45deg);}
  .shelf{
    position:absolute;bottom:26%;right:10%;
    width:130px;height:150px;
    background:var(--wood-mid);
    border:3px solid var(--wood-dark);
  }
  .shelf span{
    position:absolute;left:6px;right:6px;height:2px;background:var(--wood-dark);
  }
  .frame{
    position:absolute;
    background:var(--wood-mid);
    border:4px solid var(--wood-light);
    box-shadow:0 8px 16px rgba(0,0,0,0.4);
  }
  .frame .photo{
    position:absolute;inset:6px;
    background:linear-gradient(135deg, #cbb98c, #8f7a52);
    opacity:0.85;
  }
  .lamp-base{
    position:absolute;bottom:16%;left:12%;
    width:8px;height:70px;background:var(--wood-dark);
  }
  .lamp-shade{
    position:absolute;bottom:calc(16% + 62px);left:calc(12% - 22px);
    width:60px;height:36px;border-radius:30px 30px 4px 4px;
    background:linear-gradient(180deg, var(--warm), var(--warm-soft));
  }
  .door-locked{
    position:absolute;top:20%;right:6%;bottom:0;
    width:120px;
    background:linear-gradient(180deg, var(--wood-mid), var(--wood-dark));
    border:3px solid var(--wood-dark);
    border-radius:6px 6px 0 0;
  }
  .door-locked::after{
    content:'';position:absolute;top:45%;right:14px;
    width:10px;height:10px;border-radius:50%;
    background:var(--warm-dim);
  }

  /* ================= CORREDOR ================= */
  .room.corredor .wall{
    position:absolute;inset:0;
    background:linear-gradient(90deg, var(--wall-blue-dark), var(--wall-blue) 50%, var(--wall-blue-dark));
  }
  .corridor-floor{
    position:absolute;bottom:0;left:0;right:0;height:40%;
    background:linear-gradient(180deg, var(--wood-mid), var(--wood-dark));
  }
  .corridor-line{
    position:absolute;bottom:0;height:40%;width:2px;
    background:rgba(0,0,0,0.25);
    transform:perspective(300px) rotateX(2deg);
  }
  .sconce{
    position:absolute;top:32%;
    width:20px;height:34px;border-radius:10px 10px 4px 4px;
    background:linear-gradient(180deg, var(--warm), var(--warm-soft));
  }
  .runner-rug{
    position:absolute;bottom:2%;left:50%;transform:translateX(-50%);
    width:70%;height:5%;
    background:linear-gradient(90deg, transparent, var(--warm-dim), transparent);
    opacity:0.35;
  }

  /* ================= BIBLIOTECA ================= */
  .room.biblioteca .wall{
    position:absolute;inset:0;
    background:linear-gradient(180deg, #241a10, var(--wood) 55%, var(--wood-dark));
  }
  .bookcase{
    position:absolute;top:8%;bottom:22%;
    width:16%;
    background:var(--wood-dark);
    border:3px solid var(--wood-mid);
    display:flex;flex-direction:column;justify-content:space-evenly;padding:4px;
  }
  .bookcase .shelf-row{
    display:flex;gap:2px;height:18%;align-items:flex-end;
  }
  .book{
    flex:1;border-radius:1px 1px 0 0;
  }
  .ladder{
    position:absolute;bottom:22%;width:6px;
    background:var(--wood-light);
  }
  .reading-chair{
    position:absolute;bottom:14%;left:50%;transform:translateX(-50%);
    width:90px;height:80px;
    background:linear-gradient(180deg, var(--warm-dim), var(--wood-dark));
    border-radius:14px 14px 4px 4px;
  }
  .side-table{
    position:absolute;bottom:16%;
    width:36px;height:34px;background:var(--wood-mid);
    border-radius:2px 2px 0 0;
  }
  .lantern{
    position:absolute;top:38%;
    width:30px;height:40px;
    background:linear-gradient(180deg, var(--warm), var(--warm-soft));
    border-radius:4px;
    box-shadow:0 0 30px 10px rgba(240,185,104,0.35);
  }

  /* ================= LABORATÓRIO ================= */
  .room.laboratorio .wall{
    position:absolute;inset:0;
    background:linear-gradient(180deg, var(--lab-dark), var(--lab) 65%, #0a1614);
  }
  .bench{
    position:absolute;bottom:16%;left:8%;right:8%;height:12%;
    background:var(--wood-dark);
    border-top:4px solid var(--wood-mid);
  }
  .bench-leg{
    position:absolute;bottom:0;width:10px;height:16%;background:var(--wood-dark);
  }
  .microscope{
    position:absolute;bottom:28%;
    width:34px;height:60px;
  }
  .microscope::before{
    content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);
    width:34px;height:8px;background:#3a4a48;border-radius:3px;
  }
  .microscope::after{
    content:'';position:absolute;bottom:8px;left:50%;transform:translateX(-50%) rotate(18deg);
    width:8px;height:46px;background:linear-gradient(180deg, var(--lab-glow), #3a4a48);
    border-radius:4px;
    box-shadow:0 0 14px rgba(121,221,196,0.4);
  }
  .flask{
    position:absolute;bottom:28%;
    width:26px;height:34px;
    background:linear-gradient(180deg, rgba(121,221,196,0.55), rgba(121,221,196,0.15));
    border-radius:0 0 12px 12px;
    border:2px solid rgba(200,230,220,0.4);
    box-shadow:0 0 16px rgba(121,221,196,0.3);
  }
  .flask::before{
    content:'';position:absolute;top:-10px;left:50%;transform:translateX(-50%);
    width:8px;height:10px;background:rgba(200,230,220,0.3);
  }
  .monitor{
    position:absolute;bottom:29%;
    width:70px;height:48px;
    background:#0a1a18;
    border:3px solid var(--wood-dark);
    border-radius:3px;
  }
  .monitor::after{
    content:'';position:absolute;inset:5px;
    background:repeating-linear-gradient(0deg, rgba(121,221,196,0.25) 0px, rgba(121,221,196,0.25) 2px, transparent 2px, transparent 5px);
    opacity:0.6;
  }
  .cabinet{
    position:absolute;bottom:0;
    width:90px;height:34%;
    background:var(--wood-dark);
    border:3px solid #0a1614;
  }

  /* ================= QUARTO ================= */
  .room.quarto .wall{
    position:absolute;inset:0;
    background:linear-gradient(180deg, #1a1420, var(--wall-blue) 55%, var(--wood-dark));
  }
  .bed{
    position:absolute;bottom:10%;left:8%;
    width:280px;height:100px;
    background:linear-gradient(180deg, #cbb98c, #8f7a52);
    border-radius:10px;
  }
  .bed::before{
    content:'';position:absolute;left:0;top:-30px;width:60px;height:60px;
    background:var(--wood-dark);border-radius:8px 8px 0 0;
  }
  .pillow{
    position:absolute;top:-14px;left:70px;
    width:70px;height:34px;border-radius:14px;
    background:#f2e8d0;
  }
  .nightstand{
    position:absolute;bottom:10%;
    width:50px;height:56px;background:var(--wood-mid);
    border:2px solid var(--wood-dark);
  }
  .window-big{
    position:absolute;top:10%;right:12%;bottom:26%;
    width:34%;
    border:10px solid var(--wood-dark);
    background:linear-gradient(180deg, var(--night), var(--night-light));
    box-shadow:inset 0 0 40px rgba(0,0,0,0.6);
  }
  .window-big::before, .window-big::after{
    content:'';position:absolute;background:var(--wood-dark);
  }
  .window-big::before{top:50%;left:0;right:0;height:8px;transform:translateY(-50%);}
  .window-big::after{left:50%;top:0;bottom:0;width:8px;transform:translateX(-50%);}
  .mirror{
    position:absolute;top:14%;
    width:60px;height:110px;border-radius:30px 30px 8px 8px;
    background:linear-gradient(160deg, rgba(200,215,235,0.35), rgba(120,140,170,0.15));
    border:5px solid var(--wood-mid);
  }

  /* ================= OBSERVATÓRIO ================= */
  .room.observatorio .wall{
    position:absolute;inset:0;
    background:radial-gradient(ellipse at 50% 30%, var(--night-light), var(--night) 70%);
  }
  .dome{
    position:absolute;top:-10%;left:50%;transform:translateX(-50%);
    width:90%;height:60%;
    border-radius:50% 50% 0 0;
    background:linear-gradient(180deg, var(--wood-dark), transparent 70%);
    opacity:0.5;
  }
  .telescope-body{
    position:absolute;bottom:14%;left:50%;
    width:14px;height:130px;
    background:linear-gradient(180deg, #8a94a8, #444d5c);
    border-radius:6px;
    transform-origin:bottom center;
    transform:translateX(-50%) rotate(-28deg);
    box-shadow:0 0 20px rgba(200,210,230,0.2);
  }
  .telescope-stand{
    position:absolute;bottom:0;left:50%;transform:translateX(-50%);
    width:4px;height:16%;background:#333a44;
  }
  .telescope-stand::before, .telescope-stand::after{
    content:'';position:absolute;bottom:0;width:4px;height:100%;background:#333a44;
  }
  .telescope-stand::before{transform:rotate(20deg);left:-2px;}
  .telescope-stand::after{transform:rotate(-20deg);right:-2px;}
  .star-cluster{
    position:absolute;width:3px;height:3px;border-radius:50%;
    background:var(--star);
    animation:twinkle 3.5s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{opacity:0.25; transform:scale(1);}
    50%{opacity:1; transform:scale(1.6);}
  }
  .obs-desk{
    position:absolute;bottom:0;left:6%;
    width:150px;height:16%;
    background:var(--wood-dark);
    border-top:4px solid var(--wood-mid);
  }
  .star-map{
    position:absolute;
    width:60px;height:44px;
    background:radial-gradient(circle at 30% 40%, rgba(232,220,196,0.15), transparent 60%),
                var(--paper);
    opacity:0.15;
    border-radius:2px;
  }

  /* ---------- rotate device notice ---------- */
  .rotate-notice{
    position:fixed;inset:0;z-index:200;
    display:none;
    flex-direction:column;align-items:center;justify-content:center;
    background:var(--ink);color:var(--paper);
    text-align:center;font-family:'Cormorant Garamond', serif;
    padding:2rem;
  }
  .rotate-notice .glyph{font-size:2.6rem;margin-bottom:1rem; animation:spin 2.4s ease-in-out infinite;}
  @keyframes spin{
    0%,100%{transform:rotate(0deg);}
    50%{transform:rotate(-90deg);}
  }
  .rotate-notice p{max-width:22em;line-height:1.5;font-style:italic;opacity:0.75;font-size:1.05rem;}

  @media (orientation:portrait) and (max-width:700px){
    .rotate-notice{display:flex;}
    #app{display:none;}
  }

  /* ---------- fade in on load ---------- */
  #app{opacity:0; animation:appear 2.2s ease forwards;}
  @keyframes appear{ to{opacity:1;} }

  /* grain */
  .grain{
    position:fixed;inset:0;z-index:90;pointer-events:none;
    opacity:0.05;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");

<script>
(function(){
  const ROOMS = [
    {cls:'exterior', name:'Exterior'},
    {cls:'sala', name:'Sala'},
    {cls:'corredor', name:'Corredor'},
    {cls:'biblioteca', name:'Biblioteca'},
    {cls:'laboratorio', name:'Laboratório'},
    {cls:'quarto', name:'Quarto'},
    {cls:'observatorio', name:'Observatório'}
  ];
  const track = document.getElementById('track');
  const farsky = document.getElementById('farsky');
  const dotsEl = document.getElementById('dots');
  const hudRoomName = document.getElementById('hudRoomName');
  const hudSector = document.getElementById('hudSector');
  const hudFooter = document.getElementById('hudFooter');
  const navLeft = document.getElementById('navLeft');
  const navRight = document.getElementById('navRight');
  const soundToggle = document.getElementById('soundToggle');

  const N = ROOMS.length;
  const maxPos = (N - 1) * 100; // in vw
  let pos = 0;          // current position (vw)
  let vel = 0;           // current velocity (vw/frame)
  const maxVel = 0.9;
  const accel = 0.055;
  const friction = 0.90;
  let held = { left:false, right:false };
  let dragging = false;
  let dragStartX = 0;
  let dragStartPos = 0;
  let lastActivity = Date.now();

  // build dots
  ROOMS.forEach((r,i)=>{
    const d = document.createElement('div');
    d.className = 'dot' + (i===0 ? ' active' : '');
    dotsEl.appendChild(d);
  });

  function applyTransform(){
    track.style.transform = `translate3d(${-pos}vw,0,0)`;
    farsky.style.transform = `translate3d(${-pos*0.18}vw,0,0)`;
  }

  function updateHUD(){
    const idx = Math.min(N-1, Math.max(0, Math.round(pos/100)));
    hudRoomName.textContent = ROOMS[idx].name;
    hudSector.textContent = String(idx+1).padStart(2,'0');
    [...dotsEl.children].forEach((d,i)=> d.classList.toggle('active', i===idx));
    navLeft.classList.toggle('visible', pos > 1);
    navRight.classList.toggle('visible', pos < maxPos - 1);
  }

  function markActivity(){
    lastActivity = Date.now();
    hudFooter.classList.remove('hide');
  }

  function loop(){
    if(!dragging){
      if(held.left) vel -= accel;
      if(held.right) vel += accel;
      vel *= friction;
      if(Math.abs(vel) > maxVel) vel = Math.sign(vel)*maxVel;
      if(Math.abs(vel) > 0.001){
        pos += vel;
        if(pos < 0){ pos = 0; vel = 0; }
        if(pos > maxPos){ pos = maxPos; vel = 0; }
        applyTransform();
        updateHUD();
      }
    }
    if(Date.now() - lastActivity > 4000){
      hudFooter.classList.add('hide');
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // keyboard
  window.addEventListener('keydown', (e)=>{
    if(['ArrowLeft','a','A'].includes(e.key)){ held.left = true; markActivity(); }
    if(['ArrowRight','d','D'].includes(e.key)){ held.right = true; markActivity(); }
  });
  window.addEventListener('keyup', (e)=>{
    if(['ArrowLeft','a','A'].includes(e.key)) held.left = false;
    if(['ArrowRight','d','D'].includes(e.key)) held.right = false;
  });

  // edge nav buttons (press and hold)
  function bindHold(el, dir){
    const start = (e)=>{ e.preventDefault(); held[dir]=true; markActivity(); };
    const end = ()=>{ held[dir]=false; };
    el.addEventListener('mousedown', start);
    el.addEventListener('touchstart', start, {passive:false});
    ['mouseup','mouseleave','touchend','touchcancel'].forEach(ev=> el.addEventListener(ev, end));
  }
  bindHold(navLeft, 'left');
  bindHold(navRight, 'right');

  // wheel
  window.addEventListener('wheel', (e)=>{
    const delta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    vel += delta * 0.0012;
    markActivity();
  }, {passive:true});

  // drag (mouse + touch)
  function pointerDown(x){
    dragging = true;
    dragStartX = x;
    dragStartPos = pos;
    vel = 0;
    markActivity();
  }
  function pointerMove(x){
    if(!dragging) return;
    const deltaVw = ((dragStartX - x) / window.innerWidth) * 100;
    let next = dragStartPos + deltaVw;
    if(next < 0) next = 0;
    if(next > maxPos) next = maxPos;
    pos = next;
    applyTransform();
    updateHUD();
  }
  function pointerUp(){ dragging = false; }

  document.addEventListener('mousedown', (e)=> pointerDown(e.clientX));
  document.addEventListener('mousemove', (e)=> pointerMove(e.clientX));
  document.addEventListener('mouseup', pointerUp);
  document.addEventListener('touchstart', (e)=> pointerDown(e.touches[0].clientX), {passive:true});
  document.addEventListener('touchmove', (e)=> pointerMove(e.touches[0].clientX), {passive:true});
  document.addEventListener('touchend', pointerUp);

  updateHUD();
  applyTransform();

  // ---------- ambient synthesized sound ----------
  let audioCtx = null, noiseNode = null, filterNode = null, gainNode = null, soundOn = false;

  function buildAmbient(){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const bufferSize = 2 * audioCtx.sampleRate;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    let lastOut = 0;
    for(let i=0;i<bufferSize;i++){
      const white = Math.random()*2-1;
      lastOut = (lastOut + (0.02 * white)) / 1.02;
      data[i] = lastOut * 3.5; // brownish noise
    }
    noiseNode = audioCtx.createBufferSource();
    noiseNode.buffer = buffer;
    noiseNode.loop = true;

    filterNode = audioCtx.createBiquadFilter();
    filterNode.type = 'lowpass';
    filterNode.frequency.value = 500;

    gainNode = audioCtx.createGain();
    gainNode.gain.value = 0;

    noiseNode.connect(filterNode);
    filterNode.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    noiseNode.start(0);
  }

  soundToggle.addEventListener('click', ()=>{
    if(!audioCtx) buildAmbient();
    soundOn = !soundOn;
    const now = audioCtx.currentTime;
    gainNode.gain.cancelScheduledValues(now);
    gainNode.gain.setValueAtTime(gainNode.gain.value, now);
    gainNode.gain.linearRampToValueAtTime(soundOn ? 0.045 : 0, now + 1.2);
    soundToggle.textContent = soundOn ? 'SOM  ON' : 'SOM  OFF';
    soundToggle.classList.toggle('on', soundOn);
    if(audioCtx.state === 'suspended') audioCtx.resume();
  });

})();
</script>
